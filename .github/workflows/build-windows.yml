name: build-windows

# 说明：仓库历史分支名可能是 master，GitHub 新建仓库默认 main。
# 两个都监听，避免「CI 永远不跑」这种最容易被忽略的发布事故。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      # ---- 便携版 zip（含 WebView2 引导器与使用说明）----
      - name: Download WebView2 Bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile packaging/MicrosoftEdgeWebview2Setup.exe

      - name: Package portable zip
        shell: pwsh
        # -Force：CI 是干净 checkout，不存在本地那种「上次构建残留 DLL」，
        # 而 checkout 会把所有文件时间戳设成同一时刻，陈旧检查会误报。
        run: .\tools\portable-package.ps1 -Force

      # ---- 单文件安装版（版本从 pubspec 注入，.iss 不自行维护版本）----
      - name: Package installer (Inno Setup)
        shell: pwsh
        run: .\tools\build-installer.ps1 -Force

      - name: Collect artifacts + checksums
        shell: pwsh
        run: |
          Get-ChildItem release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          foreach ($f in Get-ChildItem release -File | Where-Object Extension -in '.zip','.exe') {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($f.FullName).sha256" -Value "$h  $($f.Name)" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapFetch-windows-x64
          path: |
            release/SnapFetch-*-win64-portable.zip
            release/SnapFetch-*-setup.exe
            release/*.sha256

  # 只有打 tag（v0.2.0 这种）才发布 Release；日常 push 只出 artifact。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: SnapFetch-windows-x64
          path: dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: CHANGELOG.md
