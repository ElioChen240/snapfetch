name: snapfetch
description: "闪取 SnapFetch — 粘贴分享链接，直接高速下载（Windows 桌面端）"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理 / 依赖注入（解析器插件化）
  flutter_riverpod: ^2.6.1

  # 网络：统一拦截器处理 Referer / Cookie / 重试
  dio: ^5.7.0

  # 本地持久化：任务/设置/收藏/历史均为 JSON 文件（见 core/、data/download）
  # —— 曾引入 drift+sqlite3，实际未使用，已移除（少一个 sqlite3.dll）

  # 凭证加密：win32 直调 DPAPI（CryptProtectData），零额外原生依赖
  win32: ^5.15.0
  ffi: ^2.2.0

  # 应用内嵌浏览器登录（WebView2）—— 行为对齐官方，底层不同
  # 注：曾试过 desktop_webview_window，无 Cookie 读取 API，已弃用并移除
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_windows: ^0.6.0

  # 预览（仅 media_kit 路径；视频平台解析下架后暂无生产者，见 README 待决项）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.9

  # 工具
  uuid: ^4.5.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/platforms/
